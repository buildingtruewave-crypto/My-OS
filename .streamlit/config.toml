[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#070B14"
secondaryBackgroundColor = "#0E1422"
textColor = "#E8EDF7"
font = "sans serif"

[server]
headless = true
runOnSave = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showSidebarNavigation = false
